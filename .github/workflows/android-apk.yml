name: Build and publish Android APK

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build an APK for external signing without publishing
        type: boolean
        default: false
      tag:
        description: Existing GitHub release tag
        required: true
        default: v1.0.1
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check signing credentials
        if: ${{ !inputs.build_only }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Android signing secrets are missing"
            exit 1
          fi

      - name: Set up Android command-line tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --silent --show-error --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Build standalone APK
        run: |
          (set +o pipefail; yes | sdkmanager --licenses >/dev/null)
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1"
          npm ci
          npm run typecheck
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew :app:assembleRelease --no-daemon --max-workers=3 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Sign and verify APK
        if: ${{ !inputs.build_only }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          [[ "v$(node -p "require('./app.json').expo.version")" == "$RELEASE_TAG" ]]
          umask 077
          key="$RUNNER_TEMP/vastkustbus.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign --ks "$key" --ks-type PKCS12 --ks-key-alias vastkustbus \
            --ks-pass env:KEYSTORE_PASSWORD --out "Vastkustbus-${RELEASE_TAG}.apk" \
            android/app/build/outputs/apk/release/app-release.apk
          "$signer" verify --verbose "Vastkustbus-${RELEASE_TAG}.apk"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.build_only }}
        with:
          name: apk-for-external-signing
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.build_only }}
        with:
          name: signed-apk
          path: Vastkustbus-*.apk
          if-no-files-found: error

  publish:
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk
      - name: Attach APK to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "Vastkustbus-${RELEASE_TAG}.apk" --repo "$GITHUB_REPOSITORY"
