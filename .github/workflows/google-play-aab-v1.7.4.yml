name: Build signed MinneTrail Google Play bundle
on:
  push:
    branches: ["build/aab-v1.7.4"]
permissions:
  contents: write
env:
  RELEASE_TAG: v1.7.4
  BUNDLE_NAME: MinneTrail-v1.7.4.aab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e9a1658796fa817db3f5ccfbeba75d1dd8f30b73
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/drawings/requirements.txt

      - name: Prepare the offline drawing model
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          python -m pip install onnx==1.20.1 onnxruntime==1.23.2
          python scripts/prepare-drawing-model.py
          python scripts/check-drawing-model.py

      - name: Check signing credentials
        if: ${{ !inputs.build_only }}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_CERT_BASE64: ${{ secrets.ANDROID_SIGNING_CERT_BASE64 }}
        run: |
          if [[ -z "$SIGNING_KEY_BASE64" || -z "$SIGNING_CERT_BASE64" ]]; then
            echo "::error::Android signing secrets are missing"
            exit 1
          fi

      - name: Set up Android command-line tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --silent --show-error --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Build release Android App Bundle
        run: |
          (set +o pipefail; yes | sdkmanager --licenses >/dev/null)
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1"
          npm ci
          # v1.0.1 has a newer expo-font peer hoisted above the Expo SDK 54 copy.
          if [[ -d node_modules/expo/node_modules/expo-font ]] &&
             [[ "$(node -p "require('expo/package.json').version")" == 54.* ]]; then
            rm -rf node_modules/expo-font
            mv node_modules/expo/node_modules/expo-font node_modules/expo-font
          fi
          npm run typecheck
          node scripts/check-coloring.cjs
          node scripts/check-family-book.cjs
          node scripts/check-seasons.cjs
          node scripts/check-hold-reset.cjs
          npx expo prebuild --platform android --no-install
          # Release AAB must be unsigned before signing with the existing release key.
          sed -i 's/signingConfig signingConfigs.debug/signingConfig null/' android/app/build.gradle
          cd android
          ./gradlew :informative-drawings:testReleaseUnitTest :app:bundleRelease --no-daemon --max-workers=3 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Validate the bundle, application ID and offline model
        run: |
          set -euo pipefail
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          curl --fail --silent --show-error --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$bundle"
          [[ "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$bundle" --xpath='/manifest/@package')" == "se.minnetrail.app" ]]
          [[ "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$bundle" --xpath='/manifest/@android:versionCode')" == "20" ]]
          [[ "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$bundle" --xpath='/manifest/@android:versionName')" == "1.7.4" ]]
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$bundle" > "$RUNNER_TEMP/manifest.xml"
          [[ "$(node -p "require('./app.json').expo.name")" == "MinneTrail" ]]
          if grep -F 'android:debuggable="true"' "$RUNNER_TEMP/manifest.xml"; then exit 1; fi
          unzip -p "$bundle" base/assets/models/informative-style1.onnx > "$RUNNER_TEMP/bundled-model.onnx"
          cmp "$RUNNER_TEMP/bundled-model.onnx" modules/informative-drawings/android/src/main/assets/models/informative-style1.onnx

      - name: Sign with the existing MinneTrail release certificate
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_CERT_BASE64: ${{ secrets.ANDROID_SIGNING_CERT_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$(mktemp -d)"
          trap 'rm -rf "$signing_dir"' EXIT
          export MINNETRAIL_SIGN_PASS="$(openssl rand -hex 32)"
          echo "::add-mask::$MINNETRAIL_SIGN_PASS"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$signing_dir/key.pk8"
          printf '%s' "$SIGNING_CERT_BASE64" | base64 --decode > "$signing_dir/cert.der"
          openssl pkcs8 -inform DER -in "$signing_dir/key.pk8" -nocrypt -out "$signing_dir/key.pem"
          openssl x509 -inform DER -in "$signing_dir/cert.der" -out "$signing_dir/cert.pem"
          openssl pkcs12 -export -inkey "$signing_dir/key.pem" -in "$signing_dir/cert.pem" -name minnetrail-upload -out "$signing_dir/upload.p12" -passout env:MINNETRAIL_SIGN_PASS
          jarsigner -keystore "$signing_dir/upload.p12" -storetype PKCS12 -storepass:env MINNETRAIL_SIGN_PASS -keypass:env MINNETRAIL_SIGN_PASS -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "$BUNDLE_NAME" android/app/build/outputs/bundle/release/app-release.aab minnetrail-upload
          jarsigner -verify -verbose -certs "$BUNDLE_NAME" > "$RUNNER_TEMP/bundle-signature.txt"
          grep -F 'jar verified.' "$RUNNER_TEMP/bundle-signature.txt"
          keytool -printcert -jarfile "$BUNDLE_NAME" > "$RUNNER_TEMP/bundle-certificate.txt"
          grep -F 'SHA256: 00:88:01:EB:1D:A9:FF:89:8E:FF:1C:C7:AE:AB:29:E8:34:D2:F3:1E:1A:1E:9C:70:8D:5C:06:0F:DD:8B:C1:E4' "$RUNNER_TEMP/bundle-certificate.txt"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$BUNDLE_NAME"
          sha256sum "$BUNDLE_NAME" > "$BUNDLE_NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: signed-google-play-bundle
          path: |
            MinneTrail-v1.7.4.aab
            MinneTrail-v1.7.4.aab.sha256
          if-no-files-found: error

      - name: Attach verified AAB to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" == "e9a1658796fa817db3f5ccfbeba75d1dd8f30b73" ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" "$BUNDLE_NAME" "$BUNDLE_NAME.sha256" --repo "$GITHUB_REPOSITORY"
