name: Check Android app

on:
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - 'modules/**'
      - 'scripts/**'
      - 'package*.json'
      - 'app.json'
      - 'app.config.js'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  RELEASE_TAG: v1.7.7


jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        distribution: [github, play]
    env:
      EXPO_PUBLIC_DISTRIBUTION: ${{ matrix.distribution }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/drawings/requirements.txt

      - name: Prepare the offline drawing model
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          python -m pip install onnx==1.20.1 onnxruntime==1.23.2
          python scripts/prepare-drawing-model.py
          python scripts/check-drawing-model.py

      - name: Check signing credentials
        if: ${{ !inputs.build_only }}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_CERT_BASE64: ${{ secrets.ANDROID_SIGNING_CERT_BASE64 }}
        run: |
          if [[ -z "$SIGNING_KEY_BASE64" || -z "$SIGNING_CERT_BASE64" ]]; then
            echo "::error::Android signing secrets are missing"
            exit 1
          fi

      - name: Set up Android command-line tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --silent --show-error --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Build standalone APK
        run: |
          (set +o pipefail; yes | sdkmanager --licenses >/dev/null)
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1"
          npm ci
          # v1.0.1 has a newer expo-font peer hoisted above the Expo SDK 54 copy.
          if [[ -d node_modules/expo/node_modules/expo-font ]] &&
             [[ "$(node -p "require('expo/package.json').version")" == 54.* ]]; then
            rm -rf node_modules/expo-font
            mv node_modules/expo/node_modules/expo-font node_modules/expo-font
          fi
          npm run typecheck
          node scripts/check-coloring.cjs
          node scripts/check-family-book.cjs
          node scripts/check-seasons.cjs
          node scripts/check-hold-reset.cjs
          node scripts/check-play-safety.cjs
          node scripts/check-cities.cjs
          npx expo prebuild --platform android --no-install
          sed -i 's/signingConfig signingConfigs.debug/signingConfig null/' android/app/build.gradle
          cd android
          ./gradlew :informative-drawings:testReleaseUnitTest :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=3 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          if [[ -f app/build/outputs/apk/release/app-release-unsigned.apk ]]; then
            mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
          fi

      - name: Verify Android application identity
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/app-identity.txt"
          grep -F "package: name='se.minnetrail.app'" "$RUNNER_TEMP/app-identity.txt"
          grep -F "application-label:'MinneTrail'" "$RUNNER_TEMP/app-identity.txt"
          npx expo-modules-autolinking resolve --platform android --json > "$RUNNER_TEMP/expo-modules.json"
          grep -F 'se.minnetrail.drawings.InformativeDrawingsModule' "$RUNNER_TEMP/expo-modules.json"

      - name: Verify the packaged offline drawing model
        run: |
          unzip -p android/app/build/outputs/apk/release/app-release.apk assets/models/informative-style1.onnx > "$RUNNER_TEMP/packaged-drawing.onnx"
          cmp "$RUNNER_TEMP/packaged-drawing.onnx" modules/informative-drawings/android/src/main/assets/models/informative-style1.onnx

      - name: Sign and verify APK
        if: ${{ !inputs.build_only }}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_CERT_BASE64: ${{ secrets.ANDROID_SIGNING_CERT_BASE64 }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          [[ "v$(node -p "require('./app.json').expo.version")" == "$RELEASE_TAG" ]]
          umask 077
          key="$RUNNER_TEMP/vastkustbus.pk8"
          cert="$RUNNER_TEMP/vastkustbus.x509.der"
          trap 'rm -f "$key" "$cert"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$key"
          printf '%s' "$SIGNING_CERT_BASE64" | base64 --decode > "$cert"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign --key "$key" --cert "$cert" \
            --out "Vastkustbus-${RELEASE_TAG}.apk" \
            android/app/build/outputs/apk/release/app-release.apk
          "$signer" verify --verbose --print-certs "Vastkustbus-${RELEASE_TAG}.apk"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.build_only }}
        with:
          name: apk-for-external-signing
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.build_only }}
        with:
          name: signed-apk-${{ matrix.distribution }}
          path: Vastkustbus-*.apk
          if-no-files-found: error

      - name: Validate and sign Google Play bundle
        if: matrix.distribution == 'play'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_CERT_BASE64: ${{ secrets.ANDROID_SIGNING_CERT_BASE64 }}
        run: bash scripts/sign-play-bundle.sh

      - uses: actions/upload-artifact@v4
        if: matrix.distribution == 'play'
        with:
          name: signed-google-play-bundle
          path: |
            MinneTrail-v1.7.7.aab
            MinneTrail-v1.7.7.aab.sha256
          if-no-files-found: error
