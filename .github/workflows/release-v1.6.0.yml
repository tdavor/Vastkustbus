name: Publish verified Västkustbus 1.6.0
on:
  push:
    branches: ["release/v1.6.0"]
permissions:
  contents: write
  actions: read
env:
  RELEASE_TAG: v1.6.0
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the tested source and signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="29a5988d5c51dfa2b6c4b5c1e326e0c23c59bef4"
          release_sha="d966c8bf57338f5c6111e9a034feae124412934f"
          source_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$source_sha" --jq '.tree.sha')"
          release_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$release_sha" --jq '.tree.sha')"
          [[ "$source_tree" == "$release_tree" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45278268047" > run.json
          jq -e --arg sha "$source_sha" '.conclusion == "success" and .head_sha == $sha' run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14868913944" > artifact.json
          jq -e --arg sha "$source_sha" '.name == "signed-apk" and .expired == false and .workflow_run.head_sha == $sha' artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14868913944/zip" > signed-apk.zip
          echo "330b3d64b7934705d64737ab6aa28460e2923d13e86663884034d859ce0bef5e  signed-apk.zip" | sha256sum --check
          unzip -j signed-apk.zip "Vastkustbus-v1.6.0.apk"
          unzip -Z1 "Vastkustbus-v1.6.0.apk" | grep -Fx 'assets/models/informative-style1.onnx'
          sha256sum "Vastkustbus-v1.6.0.apk"
      - name: Create the exact main tag and publish Android update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="d966c8bf57338f5c6111e9a034feae124412934f"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$release_sha"
          fi
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          [[ "$actual" == "$release_sha" ]]
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Västkustbus $RELEASE_TAG" --notes "Nyheter: Skriv Vår berättelse till varje minne. Fotografera eller välj barnets färglagda teckning och spara den bredvid äventyrsfotot. Skapa en familjebok som PDF med upp till 12 minnen, berättelser, målarbilder och färglagda teckningar. Dela och skriv ut boken. All bearbetning sker lokalt. Android 1.6.0 (15)." --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$RELEASE_TAG" "Vastkustbus-v1.6.0.apk" --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
